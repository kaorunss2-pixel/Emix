
name: Build EasyMix for macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the build as a GitHub release with this tag (e.g. v1.1.0). Leave empty to build only."
        required: false
        default: ""
  push:
    branches:
      - main
    # A tag push (e.g. v1.1.0) also publishes a release with the zips.
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: |
          brew install cmake ninja

      - name: Clean build
        run: |
          rm -rf build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          cmake --build build --config Release --parallel 3

      - name: Verify app
        run: |
          test -d build/EasyMix.app
          file build/EasyMix.app/Contents/MacOS/EasyMix

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/EasyMix.app \
            EasyMix-macOS-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyMix-macOS-${{ matrix.arch }}
          path: EasyMix-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  # Publishes both architectures as EasyMix-macOS-<arch>.zip assets on a tag.
  # Runs only for tag pushes (e.g. `git push origin v1.1.0`).
  release:
    name: Publish release
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Refresh the macOS assets; Windows assets on the same release stay untouched.
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            gh release create "$TAG" artifacts/*.zip \
              --title "EasyMix $TAG" \
              --notes "macOS build (arm64 + x86_64)."
          fi
